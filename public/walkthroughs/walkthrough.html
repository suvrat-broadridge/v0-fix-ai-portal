<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-COMET Platform - Complete Walkthrough</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #e0e0e0;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .screenshot {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.3s;
    }
    .screenshot:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }
    .screenshot img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .screenshot-name {
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.9em;
      color: #00d4ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 B-COMET Platform - Complete Walkthrough</h1>
    <p style="color: #888; margin-bottom: 30px;">
      4 screenshots demonstrating all application features and user journeys
    </p>
    
    <div class="gallery">
      
        <div class="screenshot">
          <img src="001_home_page.png" alt="001_home_page.png" loading="lazy">
          <div class="screenshot-name">001_home_page.png</div>
        </div>
      
        <div class="screenshot">
          <img src="002_hero_section.png" alt="002_hero_section.png" loading="lazy">
          <div class="screenshot-name">002_hero_section.png</div>
        </div>
      
        <div class="screenshot">
          <img src="003_features_section.png" alt="003_features_section.png" loading="lazy">
          <div class="screenshot-name">003_features_section.png</div>
        </div>
      
        <div class="screenshot">
          <img src="004_benefits_section.png" alt="004_benefits_section.png" loading="lazy">
          <div class="screenshot-name">004_benefits_section.png</div>
        </div>
      
    </div>

    <div style="margin-top: 40px; text-align: center;">
      <a href="WALKTHROUGH_LOG.md" style="color: #00d4ff; text-decoration: none;">📄 View Walkthrough Log</a>
      &nbsp;|&nbsp;
      <a href="../screenshots/index.html" style="color: #00d4ff; text-decoration: none;">🖼️ Back to Screenshot Gallery</a>
    </div>
  </div>
</body>
</html>
